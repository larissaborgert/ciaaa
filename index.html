<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Contato</title>
    <link rel="stylesheet" href="estilo.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header class="header">
            <span class="badge">💬 Fale Conosco</span>
            <h1>Entre em Contato</h1>
            <p>Preencha os campos abaixo para nos enviar uma mensagem.</p>
            <div class="counter-badge">
                📊 Total de contatos cadastrados: <strong id="totalContatos">0</strong>
            </div>
        </header>

        <!-- Mensagem de Sucesso (Toast / Janela Deslizante) -->
        <div id="toastSucesso" class="toast toast-sucesso">
            <div class="toast-content">
                <span class="toast-icon">🎉</span>
                <div>
                    <h3 class="toast-title">Sucesso!</h3>
                    <p class="toast-message">Seu contato foi enviado e salvo no localStorage!</p>
                </div>
            </div>
        </div>

        <form id="formContato" class="form" novalidate>
            
            <!-- 1. Nome (Texto) -->
            <div class="form-group">
                <label for="nome">Nome Completo <span class="required">*</span></label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
                <span class="error-msg" id="erroNome"></span>
            </div>

            <!-- 2. E-mail (E-mail) -->
            <div class="form-group">
                <label for="email">E-mail <span class="required">*</span></label>
                <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com">
                <span class="error-msg" id="erroEmail"></span>
            </div>

            <!-- 3. Telefone (Telefone com Máscara) -->
            <div class="form-group">
                <label for="telefone">Telefone / WhatsApp <span class="required">*</span></label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" maxlength="15">
                <span class="error-msg" id="erroTelefone"></span>
            </div>

            <div class="form-row">
                <!-- 4. Data de Nascimento (Data) -->
                <div class="form-group">
                    <label for="dataNascimento">Data de Nascimento <span class="required">*</span></label>
                    <input type="date" id="dataNascimento" name="dataNascimento">
                    <span class="error-msg" id="erroDataNascimento"></span>
                </div>

                <!-- 5. Assunto (Seleção / Dropdown) -->
                <div class="form-group">
                    <label for="assunto">Assunto <span class="required">*</span></label>
                    <select id="assunto" name="assunto">
                        <option value="">Selecione uma opção...</option>
                        <option value="Dúvidas">Dúvidas</option>
                        <option value="Suporte">Suporte Técnico</option>
                        <option value="Orçamento">Solicitar Orçamento</option>
                        <option value="Outro">Outro</option>
                    </select>
                    <span class="error-msg" id="erroAssunto"></span>
                </div>
            </div>

            <!-- 6. Opções de Preferência (Radio Buttons) -->
            <div class="form-group">
                <label>Preferência de Contato <span class="required">*</span></label>
                <div class="radio-group">
                    <label class="radio-label">
                        <input type="radio" name="preferencia" value="E-mail"> E-mail
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="preferencia" value="WhatsApp"> WhatsApp
                    </label>
                    <label class="radio-label">
                        <input type="radio" name="preferencia" value="Ligação"> Ligação
                    </label>
                </div>
                <span class="error-msg" id="erroPreferencia"></span>
            </div>

            <!-- 7. Mensagem (Área de Texto + Contador de Caracteres) -->
            <div class="form-group">
                <div class="label-with-counter">
                    <label for="mensagem">Sua Mensagem <span class="required">*</span></label>
                    <span class="char-counter"><span id="charCount">0</span>/300</span>
                </div>
                <textarea id="mensagem" name="mensagem" rows="4" maxlength="300" placeholder="Escreva sua mensagem aqui..."></textarea>
                <span class="error-msg" id="erroMensagem"></span>
            </div>

            <!-- Termos e Condições (Caixa de Marcação / Checkbox) -->
            <div class="form-group checkbox-group">
                <label class="checkbox-label">
                    <input type="checkbox" id="termos" name="termos">
                    <span>Li e aceito os <a href="#" onclick="alert('Termos aceitos!'); return false;">termos de privacidade</a> <span class="required">*</span></span>
                </label>
                <span class="error-msg" id="erroTermos"></span>
            </div>

            <button type="submit" id="btnEnviar" class="btn-submit">
                <span>Enviar Mensagem</span> 🚀
            </button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
